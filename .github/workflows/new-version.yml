name: "New Version Actions"

on:
  # Manual only. This repository is a fork consumed directly from git, and the
  # package name still belongs to the upstream npm scope, so pushes to `main`
  # must not publish. Run this deliberately if a release is ever intended.
  workflow_dispatch:

permissions:
  # Used by `create-release` to create a new release on the repo after publishing to npm.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - id: publish-to-npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }} # This token should be added from repo settings

      - id: create-gh-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ steps.publish-to-npm.outputs.version }}
          release_name: ${{ steps.publish-to-npm.outputs.version }}
