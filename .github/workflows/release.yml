name: "🚀 release"

# Modelled on perawallet/connect's release workflow so both libraries release the same way.
# Differences from that one are only where this repo differs: npm rather than pnpm, and this
# repo's own lint/type-check/test scripts.
on:
  push:
    tags:
      - "v*"

# Least-privilege default. The publish job opts into id-token below.
permissions:
  contents: read

jobs:
  release:
    name: 🚀 release
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for npm trusted-publisher provenance.
      id-token: write
      contents: read
    steps:
      - name: Setup repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          registry-url: https://registry.npmjs.org
          cache: npm

      # `prepare` runs the build on install, so the package is built before the gates below.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Resolve release channel
        id: channel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # connect publishes with no token at all: npm trusted publishing exchanges the job's OIDC
      # token for a publish credential, which is what `id-token: write` above is for. That is
      # configured per package on npmjs.com and cannot be set up before the package exists, so
      # the FIRST publish of a new package needs a token. Add NPM_AUTH_TOKEN (the same name
      # connect's repo uses) as a repository secret for that release, then configure the trusted
      # publisher for this repo and workflow on npmjs.com and delete the secret again.
      - name: 🚀 publish
        run: npm publish --access public --tag ${{ steps.channel.outputs.dist_tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      # TODO: enable GitHub Releases once the action is pinned to a commit SHA.
      # Requires bumping the job permission `contents: read` -> `contents: write`.
      # The previous workflow used actions/create-release@v1, which is archived and unmaintained.
      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@<PIN-TO-SHA> # v2
      #   with:
      #     generate_release_notes: true
      #     prerelease: ${{ contains(github.ref_name, '-') }}
